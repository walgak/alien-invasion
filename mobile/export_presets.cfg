[preset.0]
; Development export: generate an Xcode project, then sign/install with the paired phone.
name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,README.md,Play.command"
; Keep test harnesses and desktop-only helpers out of the phone package.
export_path="../build/ios/AlienInvasion.zip"

[preset.0.options]
; Apple team and reverse-DNS app identity; these identify the app, not signing secrets.
application/app_store_team_id="87G5ZZW2NF"
application/bundle_identifier="com.walgak.alieninvasion"
application/short_version="0.2"
application/version="2"
application/export_project_only=true
application/code_sign_identity_debug="Apple Development"
application/code_sign_identity_release="Apple Development"
application/targeted_device_family=0
architectures/arm64=true

[preset.1]
; Sideloadable Android test build. The editor's local debug keystore signs this APK.
; Release signing and Google Play's AAB distribution are separate deployment steps.
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,README.md,Play.command"
export_path="../build/android/AlienInvasion-debug.apk"

[preset.1.options]
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2
version/name="0.2"
package/unique_name="com.walgak.alieninvasion"
package/name="Alien Invasion"
package/signed=true
screen/immersive_mode=true
screen/edge_to_edge=true
permissions/vibrate=true
permissions/internet=false
user_data_backup/allow=false
